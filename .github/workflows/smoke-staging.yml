name: Smoke tests (staging)
# ↑↑↑ Workflow display name — shown in the Actions UI, but this is
#     NOT what branch protection matches against. The required-status-
#     check name comes from the JOB name (see the `smoke:` block below),
#     which for us is the string `smoke`. Rename this line freely; the
#     required check binding lives on the job, not here.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to test (defaults to main HEAD)"
        required: false

concurrency:
  # Same-SHA reruns cancel in-flight; different-SHA runs proceed
  # in parallel (they don't collide — per-run STAGING_SMOKE_RUN_ID
  # namespaces every DB row they create).
  group: smoke-staging-${{ github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    # ↑↑↑ REQUIRED-STATUS-CHECK CONTRACT.
    #
    # This job's `name` (below) is what GitHub Actions publishes as the
    # check-run name, and that string is what branch protection on
    # `production` matches against. The exact required context is:
    #
    #     smoke
    #
    # NOT "Smoke tests (staging)" (that's the workflow display name),
    # and NOT "Smoke tests (staging) / smoke" (that's the concatenated
    # label GitHub shows on the PR UI — the check API only carries the
    # bare job name).
    #
    # If branch protection is configured against the workflow name or
    # the display concat, no check will ever match, and every merge to
    # `production` is silently blocked forever (the required context
    # never appears green). Renaming this job — or its `name:` field —
    # is what would actually break the gate.
    #
    # AR 2026-08-14 — URL resolution used to live in a separate
    # `wait-for-vercel` job with `needs:` here, but that made this job
    # SKIP (not FAIL) when Vercel URL resolution failed, and GitHub
    # branch protection treats a `skipped` required check as PASSING.
    # That silently defeats the gate. Move the resolution INLINE so a
    # resolution failure = `smoke` = failed, not skipped.
    name: smoke
    runs-on: ubuntu-latest
    # 5 min for URL resolve + 10 min for the suite itself.
    timeout-minutes: 15
    # `deployments: read` lets us read Vercel's deployment_status
    # posts from the same-repo GITHUB_TOKEN — no third-party token
    # to rotate. `contents: read` is the default write-nothing baseline.
    permissions:
      contents: read
      deployments: read
    env:
      # Namespace every DB row this run creates + is expected to
      # clean up. Used by flow specs' unique-per-run identifiers.
      STAGING_SMOKE_RUN_ID: ${{ github.run_id }}
      # Raw-pg helpers in tests/smoke/support/flows.ts (customerEstimateUrl,
      # getJobNumber, markJobTechComplete) need direct DB access to
      # read publicToken / job number and to bypass Mark Complete's
      # work-proof UI gate. Same secret the cleanup job uses.
      # The prod-DB guard in resolveSmokeDbUrl() refuses if this
      # byte-matches PROD_DATABASE_URL.
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      # Placeholder DATABASE_URL — required at job level so the
      # `npm ci` postinstall step can run `prisma generate`.
      # prisma.config.ts throws unconditionally if DATABASE_URL is
      # unset AND .env.local is missing (2026-08-10 dev/prod
      # isolation rewrite), and CI has neither. Value is inert:
      # `prisma generate` only reads the schema file, never connects.
      # Smoke code paths that actually talk to the DB use
      # STAGING_DATABASE_URL directly via resolveSmokeDbUrl().
      # AR 2026-08-14 — surfaced when we collapsed wait-for-vercel
      # into smoke and npm ci finally ran on real CI.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
    steps:
      # ── Resolve the Vercel preview URL from GitHub Deployments ──
      #
      # Vercel's GitHub integration posts a `deployment` + one or more
      # `deployment_status` events per push. We read them via the
      # same-repo API. The final status carries `environment_url` (the
      # exact preview URL — Vercel's hash-based slugs like
      # `garage-<9chars>-libertylightllc-ctrls-projects.vercel.app`
      # are generated per deployment and can't be built from the SHA).
      #
      # Retry every 5s for up to 5 min. A failed/error deployment
      # fails the step immediately so we don't wait out the timeout
      # for a build that's already dead.
      - name: Resolve Vercel preview URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Waiting for Vercel deployment on SHA=$SHA…"
          for i in $(seq 1 60); do
            # Latest deployment for this SHA in any environment. The
            # Vercel integration typically creates one per push.
            DEPLOYMENT_ID=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=1" --jq '.[0].id // ""')
            if [ -n "$DEPLOYMENT_ID" ]; then
              STATUS=$(gh api "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses?per_page=1" --jq '.[0] // {}')
              STATE=$(echo "$STATUS" | jq -r '.state // ""')
              # environment_url is the canonical field; target_url is a
              # legacy alias some integrations still use — read both.
              URL=$(echo "$STATUS" | jq -r '.environment_url // .target_url // ""')
              echo "attempt $i: deployment_id=$DEPLOYMENT_ID state=$STATE url=$URL"
              case "$STATE" in
                success)
                  if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                    # Sanity-check the URL responds. A "success" status
                    # with a URL that returns 404 would fail late in the
                    # Playwright suite; fail here so the error is clear.
                    if curl -fsS --max-time 8 -o /dev/null "$URL/api/health"; then
                      echo "url=$URL" >> "$GITHUB_OUTPUT"
                      echo "::notice title=vercel ready::$URL"
                      exit 0
                    else
                      echo "::warning::Vercel says success but $URL/api/health did not respond — retrying"
                    fi
                  fi
                  ;;
                failure|error)
                  echo "::error::Vercel deployment $DEPLOYMENT_ID failed for $SHA (state=$STATE)"
                  exit 1
                  ;;
              esac
            else
              echo "attempt $i: no deployment posted yet for $SHA"
            fi
            sleep 5
          done
          echo "::error::Vercel deploy for $SHA never reached success in 5 min. If Vercel's GitHub integration is broken, check https://vercel.com/dashboard for the project's Git connection."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Need full history so smoke-quarantine-lint's git blame
          # can find the fixme line's original author timestamp for
          # the 7-day TTL check. Shallow clone breaks that.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Pinned to 20 to match .github/workflows/test.yml. The
          # previous `node-version-file: package.json` read from an
          # engines field that doesn't exist, so setup-node picked a
          # different default per runner-image refresh — silently OK
          # until npm ci was actually reached (smoke had always
          # skipped npm ci because it depended on a wait-for-vercel
          # job that never succeeded; AR 2026-08-14 workflow rewrite
          # exposed the latent breakage).
          node-version: "20"
          cache: npm
      - run: npm ci
      # Quarantine lint runs BEFORE the smoke suite. A fixme without a
      # linked GH issue, or a fixme older than 7 days, fails the job
      # here — so a quarantine can't quietly extend forever. Runs
      # cheap: pure JS + git blame, no browser.
      - name: Lint quarantined tests
        run: node scripts/smoke-quarantine-lint.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        env:
          STAGING_URL: ${{ steps.resolve.outputs.url }}
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  cleanup:
    # Best-effort DB cleanup of the run's tagged rows. Always runs,
    # even if the smoke job failed — leaving debris is the noisy
    # failure mode (weekly reseed picks it up but slower).
    #
    # Missing secret → fail loudly. AR asked for this specifically:
    # "I don't want cleanup quietly not running for weeks." The
    # ::error:: below plus exit 1 makes the run fail visibly, which
    # surfaces on the commit as red.
    name: Cleanup smoke test rows
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_SMOKE_RUN_ID: ${{ github.run_id }}
      # Same reason as the smoke job — prisma.config.ts throws
      # without DATABASE_URL, breaking `npm ci`'s postinstall.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to 20 to match .github/workflows/test.yml. The
          # previous `node-version-file: package.json` read from an
          # engines field that doesn't exist, so setup-node picked a
          # different default per runner-image refresh — silently OK
          # until npm ci was actually reached (smoke had always
          # skipped npm ci because it depended on a wait-for-vercel
          # job that never succeeded; AR 2026-08-14 workflow rewrite
          # exposed the latent breakage).
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Delete rows tagged with this run id
        run: node scripts/smoke-cleanup.mjs
