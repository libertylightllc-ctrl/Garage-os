name: Keep Vercel function warm

# Purpose: on Vercel Hobby tier the serverless function scales to zero
# after a few minutes of inactivity, which means the FIRST request after
# an idle window pays a cold-start cost of 5-10 seconds (10-15 seconds
# in the worst case before we pinned the region to sin1). For a garage
# floor, that translates to "the first tap after the morning coffee
# break is broken" — visibly the most-complained-about UX.
#
# This workflow pings /api/keepwarm every 5 minutes during UAE business
# hours (07:00 - 22:00 Asia/Dubai = 03:00 - 18:00 UTC) so the function
# stays warm across the working day. /api/keepwarm does a real Prisma
# query so the pooler connection stays warm too, not just the function
# process. The response is a bare 200 with no body content — the
# warming happens because the SQL ran, not because the response
# carried anything.
#
# The endpoint moved from /api/health to /api/keepwarm on 2026-08-12
# after AR flagged that /api/health was publicly returning the full
# table list and garage count (schema reconnaissance for anyone who
# hit the URL). /api/health is now a bare "ok" liveness probe.
#
# Cost: free (GitHub Actions cron is free on public repos and within
# the generous monthly minute allowance on private repos).
#
# Caveat: GitHub Actions cron is best-effort. During GitHub-wide high
# load the scheduler can drift by 15-30 minutes. Don't rely on
# exact-5-min cadence; treat this as "ping every ~5-20 min" and tune
# the window if cold starts still slip through.
#
# Outside the working window we deliberately do NOT ping — letting the
# function sleep overnight is fine; the first morning tap will be slow
# but only one person experiences it.
#
# When you upgrade to Vercel Pro, this whole workflow becomes
# unnecessary — Pro keeps the function warm by default. Delete this
# file at that point.

on:
  schedule:
    # Cron in UTC. Coverage:
    #   03:00, 03:05, ..., 17:55 UTC  →  07:00, 07:05, ..., 21:55 Asia/Dubai
    # That spans 07:00 → ~22:00 UAE which comfortably covers any
    # reasonable garage shift, including a 9 PM close (the last ping
    # lands 21:55 so the customer's 21:58 tap is still on a warm
    # function).
    - cron: "*/5 3-17 * * *"
  # Manual trigger for verification on first install + after edits.
  workflow_dispatch: {}

# Single concurrent run only — if a previous ping is somehow still
# running when the next one schedules, cancel it. Avoids a queue
# build-up if the endpoint stalls.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping /api/keepwarm
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: GET /api/keepwarm
        env:
          # The production preview URL. Update if the project alias
          # changes, or move this to a repo Variable
          # (vars.PROD_URL) to keep this file env-agnostic.
          PROD_URL: https://garage-os-puce.vercel.app
        run: |
          set -euo pipefail
          # -fsS:  fail on >=400, silent progress, show errors
          # --max-time 30: cap any one ping at 30s so a slow cold
          #                start can't tie up the runner
          # Capture status + time so the action log is grep-able.
          # /api/keepwarm returns a bare 200 with no JSON body — the
          # warming happens because the Prisma query ran. Status code
          # is the entire signal; no body-shape check to do here.
          status=$(curl -fsS --max-time 30 -o /dev/null \
                   -w "%{http_code}|%{time_total}" \
                   "$PROD_URL/api/keepwarm")
          http=${status%%|*}
          time=${status#*|}
          echo "::notice title=keep-warm ping::status=$http time=${time}s"
