name: Nightly DB backup

# pg_dump production → gzip → GPG-encrypt → upload to Backblaze B2.
# Off-Supabase recovery story: even total loss of the Supabase project
# is recoverable from the encrypted dumps sitting in B2 (where retention
# is 90 days, managed by the bucket's lifecycle rule).
#
# Nightly cron enabled 2026-06-29 after the manual run at
# 2026-06-29T12:52:47Z succeeded end-to-end (encrypted file in B2,
# healthcheck ping fired) AND the restore drill proved that file decrypts
# + restores cleanly. Runbook: docs/Disaster-Recovery.md.

on:
  workflow_dispatch:        # still allow ad-hoc runs from the UI
  schedule:
    # 22:00 UTC = 02:00 next-day UAE. Off-peak for the garages, off-peak
    # for the Supabase pooler, and several hours before AR's morning so
    # any failure ping arrives before the workday.
    - cron: '0 22 * * *'

# Belt-and-braces — minimum permissions. The runner does not need to
# write to the repo, comment on PRs, or touch any GitHub resource.
permissions:
  contents: read

# Don't fan out — one run at a time. If a previous run is still in
# flight (manual + scheduled overlap, or someone double-clicks
# "Run workflow"), the second waits.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    # If pg_dump hangs (DB unreachable, runner network issue), fail the
    # job after 15 min rather than burning Actions minutes. Our DB at
    # current size dumps in under 30 seconds; 15 min is ample headroom
    # for growth + transient slowness.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backup script
        # All 7 secrets piped in via env. The script itself uses `set
        # +x` so values are never printed; GitHub Actions also auto-
        # masks any token that matches a registered secret value as
        # an extra defense layer.
        env:
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY:    ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME:        ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT:           ${{ secrets.B2_ENDPOINT }}
          GPG_PASSPHRASE:        ${{ secrets.GPG_PASSPHRASE }}
          HEALTHCHECKS_URL:      ${{ secrets.HEALTHCHECKS_URL }}
        run: bash scripts/backup-prod-db.sh
