name: Tests

# Runs the vitest suite on every PR + on every push to main.
#
# The 31 tenant-isolation tests in src/lib/__tests__/tenant-isolation.test.ts
# need a real Postgres to seed two garages and prove cross-garage reads
# return nothing. We spin up an EPHEMERAL postgres:16 service container
# rather than running tests against the production Supabase DB, so a
# crashed test run can never pollute prod (the worst it can do is leave
# rows in the throwaway container that GitHub destroys at job end).
#
# Tests are also gated on typecheck — a TypeScript error fails the PR
# before any test even tries to run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an older run on the same PR/branch if a new push lands while
# the first is still running.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Wait for the DB to accept connections before the job starts
        # running steps that talk to it.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Localhost connection — pg-adapter.ts auto-skips SSL when URL
      # contains "localhost", so no extra config needed.
      DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: PII-in-URL check
        # Fails the build if any file under src/app/advisor/** or
        # src/app/actions/** constructs a URL that carries a watched
        # PII key (ownerName / phone / email / vin / chassis / mobile).
        # Written after the same class of bug appeared in two slices —
        # see docs/intake-duplicate-handling-spec.md § "PII in URL".
        # Runs BEFORE typecheck so the fastest guardrail fires first.
        run: node scripts/check-pii-in-urls.mjs

      - name: Apply Prisma migrations
        # `prisma migrate deploy` applies every committed migration
        # against the ephemeral postgres without trying to detect
        # drift (which is what `db push` would do). Idempotent.
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        # Includes the 31 tenant-isolation tests plus all existing
        # unit tests. The isolation tests seed → assert → cleanup
        # within the ephemeral DB; nothing reaches Supabase.
        run: npx vitest run
